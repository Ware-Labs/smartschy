[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasheet-rag"
version = "0.1.0"
description = "Local CLI scaffolding for technical PDF retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=2.0,<3.0",
  "openai>=1.0,<2.0",
  "pillow>=12.0,<13.0",
  "pymupdf>=1.26,<2.0",
  "typer>=0.16,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
datasheet-rag = "datasheet_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["datasheet_rag"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
